<nav class="sidebar" [class.expanded]="isExpanded">
  <button class="toggle-btn" (click)="toggle()">
    <i
      class="pi"
      [ngClass]="
        isExpanded ? 'pi-angle-left toggle-btn-expanded' : 'pi-angle-right'
      "
    >
    </i>
  </button>

  <div class="logo-container">
    <img src="assets/logo4.png" alt="Lava Jato Logo" />
    <span class="label-titulo-logo">AUTO BRILHO</span>
  </div>

  <hr class="divider" />

  <a routerLink="/dashboard" routerLinkActive="active">
    <i class="pi pi-home"></i>
    <span class="label">Dashboard</span>
  </a>

  <a routerLink="/clientes" routerLinkActive="active">
    <i class="pi pi-users"></i>
    <span class="label">Clientes</span>
  </a>

  <a routerLink="/services" routerLinkActive="active">
    <i class="pi pi-briefcase"></i>
    <span class="label">Serviços</span>
  </a>

  <div class="user-info">
    <a class="user-info" routerLink="/perfil" routerLinkActive="active">
      <i class="pi pi-user"></i>
      <span class="user-label">{{ userName || userEmail }}</span>
    </a>
  </div>
</nav>
